<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レシピブログ</title>

    <style>
        body {
            font-family: "Yu Gothic", sans-serif;
            margin: 40px;
            background: #fafafa;
            line-height: 1.7;
        }
        h1 {
            border-bottom: 3px solid #333;
            padding-bottom: 10px;
        }
        .recipe {
            background: #fff;
            padding: 20px;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .recipe h2 {
            margin-top: 0;
        }
        ul {
            margin-top: 0;
        }
        .step {
            margin-bottom:10px;
        }

    </style>
</head>
<body>
    <h1>豚丼レシピ</h1>
    <p>YouTube「隆二のバズレシピ」の豚丼レシピ</p>

    <div class="recipe"></div>
    <h2>🐷シン・豚丼</h2>
    <h3>材料（１人前）</h3>
    <ul>
        <li>ご飯：200g</li>
        <li>豚バラ肉：120g</li>
        <li>玉ねぎ：30g</li>
        <li>卵黄：1個</li>
        <li>砂糖：小さじ1＋小さじ2</li>
        <li>水：大さじ1/2</li>
        <li>醤油：大さじ1＋小さじ1</li>
        <li>酒：大さじ1</li>
        <li>みりん：大さじ1/2</li>
    </ul>

    <h3>作り方</h3>
    <div class="step">1. フライパンに砂糖小さじ1＋水小さじ1を入れ、カラメル化する。</div>
    <div class="step">2. 調味料と玉ねぎを入れて沸かし、少し煮詰める。</div>
    <div class="step">3. 豚バラ肉を入れて絡める。</div>
    <div class="step">4. ご飯を盛り、アタマをのせ、卵黄を真ん中にのせて完成。</div>
</body>
</html>
