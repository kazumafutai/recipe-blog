<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>レシピブログ</title>
<style>
    body {
        font-family: "Hiragino Sans", "Meiryo", sans-serif;
        margin: 0;
        padding: 0;
        background: #fafafa;
        color: #333;
    }
    header {
        background: #ff7043;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 28px;
        font-weight: bold;
    }

    .container {
        max-width: 1000px;
        margin: 30px auto;
        padding: 0 20px;
    }

    /* 横並びボタンのグリッド */
    .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }

    /* カテゴリーボタン */
    .category-btn {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
    }
    .category-btn:hover {
        background: #ffe8df;
    }
    .category-btn svg {
        width: 60px;
        height: 60px;
        margin-bottom: 10px;
    }
    .category-btn h2 {
        margin: 0;
        font-size: 20px;
        color: #444;
    }

    /* リボン（展開部分） */
    .ribbon {
        display: none;
        background: #fff7f2;
        border-left: 5px solid #ff7043;
        padding: 15px 20px;
        margin-bottom: 20px;
        border-radius: 0 0 12px 12px;
    }
    .ribbon a {
        display: block;
        font-size: 18px;
        color: #ff7043;
        text-decoration: none;
        margin-bottom: 10px;
    }
    .ribbon a:hover {
        text-decoration: underline;
    }

    /* スマホ対応（2列にする） */
    @media (max-width: 700px) {
        .grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    /* リボン内のメニューを3列にする */
    .ribbon-menu {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 10px;
    }

    .ribbon-menu a {
        background: white;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        font-size: 16px;
        color: #ff7043;
        text-decoration: none;
    }

    .ribbon-menu a:hover {
        background: #ffe8df;
    }

    /* スマホでは1列にする */
    @media (max-width: 700px) {
        .ribbon-menu {
            grid-template-columns: repeat(1, 1fr);
        }
    }

</style>

<script>
function toggleRibbon(id) {
    const ribbon = document.getElementById(id);
    ribbon.style.display = (ribbon.style.display === "block") ? "none" : "block";
}
</script>

</head>
