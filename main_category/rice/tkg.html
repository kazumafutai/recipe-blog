<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>卵かけご飯</title>

<style>
body {
  font-family: "Yu Gothic", sans-serif;
  margin: 0;
  background: #fafafa;
  line-height: 1.8;
}

/* ヘッダー */
header {
  background: #ff7043;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
}

/* メインコンテンツ */
.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 20px;
}

/* 写真カード */
.photo-card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  margin-bottom: 30px;
}

.photo-card img {
  width: 100%;
  height: 300px;
  object-fit: cover;
}

.photo-card .caption {
  padding: 15px;
  font-size: 18px;
  color: #555;
  text-align: center;
}

/* レシピカード */
.recipe-card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  margin-bottom: 40px;
}

.recipe-card h2 {
  margin-top: 0;
  border-left: 6px solid #ff7043;
  padding-left: 10px;
  font-size: 24px;
}

.recipe-card h3 {
  margin-top: 25px;
  font-size: 20px;
  color: #444;
}

/* 材料カード（横並び） */
.ingredients-wrapper {
  display: flex;
  gap: 30px;
  margin-top: 20px;
}

.ingredients-block {
  background: #fff;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  width: 250px;
}

.ingredients-title {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 10px;
  color: #ff7043;
  border-bottom: 2px solid #ff7043;
  padding-bottom: 4px;
}

ul {
  margin-top: 10px;
  padding-left: 20px;
}

/* 作り方ステップ */
.step {
  background: #fff7f2;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 10px;
  border-left: 4px solid #ff7043;
}

/* スマホ対応 */
@media (max-width: 700px) {
  .ingredients-wrapper {
    flex-direction: column;
  }
  .photo-card img {
    height: 200px;
  }
}
</style>

</head>

<body>

<header>卵かけご飯</header>

<div class="container">

  <!-- 写真カード -->
  <div class="photo-card">
    <img src="img/tkg.jpg" alt="卵かけご飯">
    <div class="caption">白身も具材に「TKG」</div>
  </div>

  <!-- レシピカード -->
  <div class="recipe-card">
    <h2>材料（1人前）</h2>

    <div class="ingredients-wrapper">
      <div class="ingredients-block"><ul><li>ご飯：180g</li><li>卵：1個</li><li>醤油：小さじ2</li><li>かつお粉：1つまみ</li><li>味の素：2振り</li></ul></div>
    </div>

    <h2>作り方</h2>

    <div id="steps">
      <div class="step">1. 炊き立てご飯を電子レンジ600W 2分温める</div><div class="step">2. もしくは、冷凍ご飯を600W 4分温める</div><div class="step">3. 温かいうちに卵白だけかけ、かき混ぜる</div><div class="step">4. 卵黄を乗せ、醤油・味の素・かつお粉をかけて完成</div>
    </div>

  </div>

</div>

</body>
</html>
