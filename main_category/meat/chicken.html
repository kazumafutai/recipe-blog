<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>鶏肉料理メニュー一覧</title>

<style>
    body {
        font-family: "Hiragino Sans", "Meiryo", sans-serif;
        margin: 0;
        padding: 0;
        background: #fafafa;
        color: #333;
    }


    header {
        background: #ff7043;
        color: white;
        padding: 20px;
        font-size: 26px;
        font-weight: bold;

        position: relative; /* これがポイント */
        text-align: center; /* タイトルを中央にする */
    }

    .back-link {
        position: absolute;
        right: 20px;   /* 右端に固定 */
        top: 50%;
        transform: translateY(-50%); /* 縦位置を中央に揃える */

        color: white;
        text-decoration: none;
        font-size: 18px;
        background: rgba(255,255,255,0.2);
        padding: 8px 14px;
        border-radius: 8px;
    }

    .back-link:hover {
        background: rgba(255,255,255,0.35);
    }



    .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding: 20px;
        max-width: 1000px;
        margin: 0 auto;
    }

    .menu-item {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        overflow: hidden;
        text-align: center;
        transition: 0.2s;
    }

    .menu-item:hover {
        transform: translateY(-4px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .menu-item img {
        width: 100%;
        height: 150px;
        object-fit: cover;
    }

    .menu-item a {
        display: block;
        padding: 12px;
        font-size: 18px;
        color: #ff7043;
        text-decoration: none;
        font-weight: bold;
    }

    .menu-item a:hover {
        text-decoration: underline;
    }

    /* スマホ対応 */
    @media (max-width: 700px) {
        .menu-grid {
            grid-template-columns: repeat(1, 1fr);
        }
    }
</style>

</head>
